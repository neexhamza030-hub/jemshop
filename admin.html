<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>JEM Protein Admin</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<h1>JEM Protein Admin Panel</h1>

</header>

<section class="admin-panel">

<h2>Add Product</h2>

<form id="productForm">

<input
type="text"
id="name"
placeholder="Product Name"
required>

<input
type="number"
id="price"
placeholder="Price"
required>

<input
type="text"
id="category"
placeholder="Category"
required>

<input
type="number"
id="stock"
placeholder="Stock"
required>

<input
type="file"
id="image">

<textarea
id="description"
placeholder="Description"></textarea>

<button type="submit">

Publish Product

</button>

</form>

<hr>

<h2>Products</h2>

<div id="adminProducts"></div>

</section>

<script src="js/firebase.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
